# Release archives for a version tag (v*). Builds and tests on each platform,
# packages with scripts/package-release.sh and attaches the archives and
# checksums to a DRAFT release that a maintainer reviews and publishes by
# hand. Nothing is published to a package registry.
#
# A successful tagged run establishes support for a release target.
# Until a tagged run has succeeded on a platform, that platform is not a
# supported release target; see docs/reference/security.md.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_PROFILE_TEST_OPT_LEVEL: "1"
  CARGO_PROFILE_TEST_DEBUG_ASSERTIONS: "true"
  CARGO_PROFILE_TEST_OVERFLOW_CHECKS: "true"

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, target: aarch64-apple-darwin }
          - { os: macos-15-intel, target: x86_64-apple-darwin }
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Prepare Linux replay runtime
        if: runner.os == 'Linux'
        run: scripts/setup-ci-linux-runtime.sh
      - name: Build first-party fixtures
        run: scripts/setup-ci-fixtures.sh
      - run: cargo test --workspace --locked
      - run: scripts/package-release.sh ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: midwrite-${{ matrix.target }}
          path: |
            target/package/*.tar.gz
            target/package/*.sha256

  # Binaries for the npm packages (`midwrite` and @midwrite/cli-*). Linux
  # builds are static musl so they run on any distribution; Windows has no
  # runtime replay (built without the `replay` feature). Each binary is
  # smoke-tested on its own OS. The packages are assembled and published
  # from these artifacts with scripts/npm-cli.py; nothing is published here.
  npm-binaries:
    name: npm binary ${{ matrix.npm }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, target: aarch64-apple-darwin, npm: darwin-arm64 }
          - { os: macos-15-intel, target: x86_64-apple-darwin, npm: darwin-x64 }
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-musl, npm: linux-x64 }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, npm: linux-arm64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, npm: win32-x64, features: --no-default-features }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }} -p midwrite-cli --bin midwrite ${{ matrix.features }}
      - name: Smoke test
        run: |
          exe="target/${{ matrix.target }}/release/midwrite"
          if [[ "$RUNNER_OS" == Windows ]]; then exe="$exe.exe"; fi
          "$exe" --version
          set +e
          "$exe" check fixtures/vulnerable --format json > check.json
          code=$?
          set -e
          test "$code" -eq 1
          python3 -c "import json; d = json.load(open('check.json')); assert d['diagnostics'], 'no diagnostics'"
          mkdir -p dist && cp "$exe" dist/
      - uses: actions/upload-artifact@v4
        with:
          name: midwrite-npm-${{ matrix.npm }}
          path: dist/*
          if-no-files-found: error

  draft-release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create a draft release (published manually)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" --notes "Draft: review before publishing." --repo "$GITHUB_REPOSITORY" dist/*
