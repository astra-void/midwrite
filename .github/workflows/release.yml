# Release archives for a version tag (v*). Builds and tests on each platform,
# packages with scripts/package-release.sh and attaches the archives and
# checksums to a DRAFT release that a maintainer reviews and publishes by
# hand. Nothing is published to a package registry.
#
# A successful tagged run establishes support for a release target.
# Until a tagged run has succeeded on a platform, that platform is not a
# supported release target; see docs/phase4/RELEASE-READINESS.md.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, target: aarch64-apple-darwin }
          - { os: macos-15-intel, target: x86_64-apple-darwin }
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Prepare Linux replay runtime
        if: runner.os == 'Linux'
        run: scripts/setup-ci-linux-runtime.sh
      - name: Build first-party fixtures
        run: scripts/setup-ci-fixtures.sh
      - run: cargo test --workspace --locked
      - run: scripts/package-release.sh ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: midwrite-${{ matrix.target }}
          path: |
            target/package/*.tar.gz
            target/package/*.sha256

  draft-release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create a draft release (published manually)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" --notes "Draft: review before publishing." --repo "$GITHUB_REPOSITORY" dist/*
