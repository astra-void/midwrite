# Midwrite CI. Static analysis and unit tests on Linux and macOS; required
# runtime replay (PostgreSQL + bubblewrap isolation + Node.js/Drizzle + Bun)
# on Linux. Replay tests run with MIDWRITE_REQUIRE_REPLAY=1: a missing
# prerequisite or a blocked isolation backend FAILS the job instead of
# skipping (docs/architecture/replay-protocol.md).
#
# Nothing is uploaded anywhere: reports stay in the job's workspace and are
# summarized in the log.
#
# scripts/setup-ci-fixtures.sh installs only first-party test applications.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Model exploration is CPU-heavy; retain test assertions and overflow checks.
  CARGO_PROFILE_TEST_OPT_LEVEL: "1"
  CARGO_PROFILE_TEST_DEBUG_ASSERTIONS: "true"
  CARGO_PROFILE_TEST_OVERFLOW_CHECKS: "true"

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  static:
    name: static tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Prepare Linux replay runtime
        if: runner.os == 'Linux'
        run: scripts/setup-ci-linux-runtime.sh
      - name: Build first-party fixtures
        run: scripts/setup-ci-fixtures.sh
      - name: Build (release)
        run: cargo build --release --locked
      - name: Build without the replay feature
        run: cargo build --locked -p midwrite-cli --no-default-features
      # Replay tests are not required here: without their prerequisites they
      # print SKIPPED and do not count as runtime verification.
      - name: Tests (static analysis, unit, CLI)
        run: cargo test --workspace --locked
      - name: SARIF and trace schema validation
        run: |
          python3 -m venv .venv && .venv/bin/pip install --quiet jsonschema
          curl -fsSL -o sarif-2.1.0.json https://docs.oasis-open.org/sarif/sarif/v2.1.0/errata01/os/schemas/sarif-schema-2.1.0.json
          ./target/release/midwrite check fixtures/vulnerable --config fixtures/midwrite.json --format sarif --fail-on never > fixtures.sarif
          ./target/release/midwrite trace fixtures/vulnerable --config fixtures/midwrite.json --format json > fixtures.traces.json
          .venv/bin/python scripts/validate-schemas.py --sarif-schema sarif-2.1.0.json fixtures.sarif fixtures.traces.json
          .venv/bin/python scripts/tests/test_verification_schemas.py
          # A fresh discovery report against the published discovery-report schema.
          ./target/release/midwrite discover fixtures/apps/worlds-app --model-check --format json --output discovery.json > /dev/null || true
          .venv/bin/python scripts/validate-schemas.py discovery.json

  precision:
    name: held-out precision >= 0.9
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test the evaluation gate
        run: python3 -m unittest discover -s scripts -p 'test_eval.py'
      - name: Build the static analyzer (release)
        run: cargo build --release --locked -p midwrite-cli
      - name: Fetch pinned held-out projects
        run: python3 scripts/eval.py fetch --set held-out
      - name: Require held-out hazard precision >= 0.9
        run: python3 scripts/eval.py run --set held-out --gate -o eval.json

  replay-linux:
    name: required replay (Linux, bubblewrap)
    runs-on: ubuntu-24.04
    env:
      MIDWRITE_REQUIRE_REPLAY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.3"
      - name: Prepare Linux replay runtime
        run: scripts/setup-ci-linux-runtime.sh
      - name: Build first-party fixtures
        run: scripts/setup-ci-fixtures.sh
      - name: Tests including required replay
        run: cargo test --workspace --locked
      - name: Drizzle replay (CLI) and verification schema validation
        run: |
          cargo build --release --locked
          ./target/release/midwrite replay fixtures/replay/drizzle-node --allow-execution --format json --output drizzle-node.json > /dev/null
          ./target/release/midwrite replay fixtures/replay/order-vulnerable --allow-execution \
            --baseline fixtures/reports/replay/order-vulnerable.json \
            --format json --output order-vulnerable.json --regression-output order-vulnerable.regression.json > /dev/null
          python3 -m venv .venv && .venv/bin/pip install --quiet jsonschema
          .venv/bin/python scripts/validate-schemas.py drizzle-node.json order-vulnerable.json order-vulnerable.regression.json
          .venv/bin/python scripts/tests/test_verification_schemas.py
          python3 -c "import json; r=json.load(open('drizzle-node.json')); assert r['environment']['isolation']=='bubblewrap', r['environment']; print(r['summary'])"
