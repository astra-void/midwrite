[package]
name = "commitrift-cli"
description = "Command-line interface for the CommitRift failure-path analyzer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "commitrift_cli"
path = "src/lib.rs"

[[bin]]
name = "commitrift"
path = "src/main.rs"

# Compatibility executable for automation written before the rename. Same
# behavior as `commitrift`, with a deprecation note on standard error.
[[bin]]
name = "crashproof"
path = "src/bin/crashproof.rs"

[features]
default = ["replay"]
# Runtime replay (`commitrift replay`). Without it the binary contains only
# static analysis and report rendering.
replay = ["dep:commitrift-replay", "commitrift-model/postgres"]

[dependencies]
commitrift-core.workspace = true
commitrift-analyzer.workspace = true
commitrift-model.workspace = true
commitrift-replay = { workspace = true, optional = true }
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
