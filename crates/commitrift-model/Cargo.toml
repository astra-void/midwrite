[package]
name = "commitrift-model"
description = "Bounded explicit-state model checker for CommitRift: concurrent actors, PostgreSQL transaction isolation, crashes and retries"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = ["postgres"]
# Differential validation against a real PostgreSQL (`commitrift model-check
# --validate-postgres`). The engine itself does not need it.
postgres = ["dep:commitrift-replay", "dep:libc"]
# Phase 10: lets a test delete one kind of access from every footprint, to
# measure whether the differential tests notice a missing dependency
# (`tests/por_mutation.rs`). Never enabled in a release build.
mutation-testing = []

[dev-dependencies]
commitrift-model = { path = ".", features = ["mutation-testing"] }

[dependencies]
commitrift-replay = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
libc = { version = "0.2", optional = true }
