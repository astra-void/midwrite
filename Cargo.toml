[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
authors = ["Midwrite contributors"]

[workspace.dependencies]
midwrite-core = { path = "crates/midwrite-core", version = "0.1.0" }
midwrite-analyzer = { path = "crates/midwrite-analyzer", version = "0.1.0" }
midwrite-discover = { path = "crates/midwrite-discover", version = "0.1.0" }
midwrite-replay = { path = "crates/midwrite-replay", version = "0.1.0" }
midwrite-model = { path = "crates/midwrite-model", version = "0.1.0", default-features = false }
oxc_allocator = "0.155.0"
oxc_ast = "0.155.0"
oxc_ast_visit = "0.155.0"
oxc_parser = "0.155.0"
oxc_semantic = "0.155.0"
oxc_span = "0.155.0"
oxc_syntax = "0.155.0"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
thiserror = "2"
walkdir = "2"
clap = { version = "4", features = ["derive"] }
