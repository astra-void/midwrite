[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
authors = ["CommitRift contributors"]

[workspace.dependencies]
commitrift-core = { path = "crates/commitrift-core", version = "0.1.0" }
commitrift-analyzer = { path = "crates/commitrift-analyzer", version = "0.1.0" }
commitrift-replay = { path = "crates/commitrift-replay", version = "0.1.0" }
commitrift-model = { path = "crates/commitrift-model", version = "0.1.0", default-features = false }
oxc_allocator = "0.155.0"
oxc_ast = "0.155.0"
oxc_ast_visit = "0.155.0"
oxc_parser = "0.155.0"
oxc_semantic = "0.155.0"
oxc_span = "0.155.0"
oxc_syntax = "0.155.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
walkdir = "2"
clap = { version = "4", features = ["derive"] }
